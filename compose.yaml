services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce_ai
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data

volumes:
  ecommerce-postgres-data:
